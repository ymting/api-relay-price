<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="中转站比价">
  <!-- 站点图标：蓝底 + 白色人民币/价格符号。
       刻意只保留一根横杠——32 网格缩到 16px 时，两根横杠之间的空隙会糊死，
       标签页里就只剩一坨白块；单横杠在 16px 仍能认出是 ¥。
       笔画全部用 stroke + round 端头，不依赖任何字体，缩放锐利。 -->
  <defs>
    <linearGradient id="relayIconBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4368f5"/>
      <stop offset="1" stop-color="#2443bf"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#relayIconBg)"/>
  <g stroke="#fff" stroke-width="3.3" stroke-linecap="round" fill="none">
    <!-- 上方两撇组成 V，与竖线交汇成 ¥ 的头部 -->
    <path d="M10.2 9.6 L16 15.8 L21.8 9.6"/>
    <!-- 竖线：从交汇点下探到接近底边，重心略偏下，视觉上更稳 -->
    <path d="M16 15 L16 22.6"/>
    <!-- 单横杠：价格符号的识别点 -->
    <path d="M10.6 18.8 L21.4 18.8"/>
  </g>
</svg>
