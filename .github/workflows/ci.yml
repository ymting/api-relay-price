name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: 后端回归
        env:
          PYTHONUTF8: "1"
        run: python -X utf8 -m unittest discover -s tests -v
      - name: 前端与脚本回归
        run: |
          node tests/test_stage_a_ui.js
          node tests/test_site_framework_ui.js
          python -X utf8 tests/check_page_syntax.py
      - name: 部署冒烟（真实进程）
        env:
          PYTHONUTF8: "1"
        run: python -X utf8 tests/smoke_deploy.py --mode process

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: 后端回归
        env:
          PYTHONUTF8: "1"
        run: python -X utf8 -m unittest discover -s tests -v
      - name: 前端与脚本回归
        run: |
          node tests/test_stage_a_ui.js
          node tests/test_site_framework_ui.js
          python -X utf8 tests/check_page_syntax.py
      - name: Edge 专项
        env:
          PYTHONUTF8: "1"
        run: |
          python -X utf8 tests/check_stage_d_browser.py
          python -X utf8 tests/check_key_ccs_browser.py
