name: Image

# 正式镜像只在发布 Release 时构建；dev 分支单独走 dev-latest 通道。
# main 上的普通推送不产镜像，避免"合并一次就发一个版本"。
on:
  push:
    branches: [dev]
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      # 版本校验：dev 必须带 -n 递增后缀；正式发布必须与标签一致且不带后缀。
      - id: version
        name: 读取并校验版本号
        run: |
          set -eu
          V="$(tr -d '[:space:]' < VERSION)"
          echo "读到版本号：$V"
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            case "$V" in
              *-*) echo "::error::正式发布不能带递增后缀：$V"; exit 1 ;;
            esac
            if [ "$V" != "$TAG" ]; then
              echo "::error::VERSION($V) 与发布标签($TAG) 不一致"
              exit 1
            fi
            # 正式版本必须来自 main，防止从特性分支误发。
            git fetch --no-tags origin main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::发布标签所在提交不在 main 上"
              exit 1
            fi
          else
            if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$'; then
              echo "::error::dev 版本必须形如 1.2.3-1（当前 $V），先跑 python bump_version.py --dev"
              exit 1
            fi
          fi
          echo "value=$V" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          tags: |
            type=raw,value=dev-latest,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha,prefix=sha-

      # 先构建到本地跑冒烟，通过后才登录并推送，避免把坏镜像留在 GHCR。
      - name: 构建到本地
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          load: true
          tags: relay-price:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 容器冒烟
        env:
          PYTHONUTF8: "1"
        run: python -X utf8 tests/smoke_deploy.py --mode docker --image relay-price:smoke

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送镜像
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
